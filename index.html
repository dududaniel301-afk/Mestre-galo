<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA | Solo Leveling Reality</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Rajdhani', sans-serif; background-color: #050505; color: #f4f4f5; }
        .font-system { font-family: 'Black Ops One', cursive; }
        .glow-blue { box-shadow: 0 0 20px rgba(37, 99, 235, 0.3); }
        .glow-red { box-shadow: 0 0 30px rgba(220, 38, 38, 0.5); }
        .level-up-flash { animation: flash 0.5s ease-out; }
        @keyframes flash { from { background: white; opacity: 1; } to { background: transparent; opacity: 0; } }
        .hidden { display: none; }
    </style>
</head>
<body class="overflow-x-hidden border-t-4 border-blue-600">

    <div id="boss-overlay" class="fixed inset-0 bg-black/95 z-[100] hidden flex flex-col items-center justify-center p-6 border-8 border-red-600">
        <div class="text-red-600 font-system text-6xl mb-4 animate-pulse uppercase">Boss Fight!</div>
        <div id="boss-timer" class="text-9xl font-system text-white mb-10">05:00</div>
        <div class="bg-red-900/20 border border-red-600 p-6 rounded mb-8 text-center max-w-sm">
            <p class="text-red-400 font-bold uppercase mb-2">Missão: Sobrevivência</p>
            <p class="text-white italic">"Faça o máximo de flexões até o tempo acabar ou o sistema falhar."</p>
        </div>
        <button onclick="vencerBoss()" class="bg-red-600 hover:bg-red-700 text-white font-system px-12 py-5 text-2xl glow-red transform active:scale-95">ESTÁ FEITO</button>
    </div>

    <div class="max-w-4xl mx-auto p-6">
        <header class="flex justify-between items-end mb-12">
            <div>
                <p class="text-blue-500 font-bold tracking-widest text-xs uppercase mb-1">Status do Host</p>
                <h1 id="user-rank" class="text-5xl font-system text-white uppercase tracking-tighter italic">Rank F</h1>
            </div>
            <div class="text-right">
                <p class="text-xs text-zinc-500 font-bold uppercase">Progresso de Evolução</p>
                <div class="w-48 h-3 bg-zinc-900 border border-zinc-800 rounded-full mt-2 overflow-hidden">
                    <div id="xp-bar" class="bg-blue-600 h-full transition-all duration-500" style="width: 20%"></div>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <section class="bg-zinc-900/50 p-6 border border-zinc-800 rounded-xl glow-blue">
                <h2 class="font-system text-blue-500 text-xl mb-4 flex items-center gap-2">
                    <i data-lucide="zap"></i> Missão do Dia
                </h2>
                <div class="space-y-4 mb-8">
                    <div class="flex justify-between border-b border-zinc-800 pb-2">
                        <span class="text-zinc-400">Agachamentos</span>
                        <span class="font-bold">3 x 20</span>
                    </div>
                    <div class="flex justify-between border-b border-zinc-800 pb-2 text-zinc-600">
                        <span>Flexão (Bloqueado)</span>
                        <span>???</span>
                    </div>
                </div>
                <button onclick="ganharXP()" class="w-full py-4 bg-blue-600 text-white font-system uppercase tracking-widest hover:bg-blue-500 active:scale-95 transition-all">Registrar Série</button>
            </section>

            <section class="bg-zinc-900/50 p-6 border border-zinc-800 rounded-xl">
                <h2 class="font-system text-emerald-500 text-xl mb-4 flex items-center gap-2">
                    <i data-lucide="flask-conical"></i> Alquimia (Dieta)
                </h2>
                <div id="alchemy-ia" class="text-sm italic text-zinc-400 mb-4 font-mono">
                    "Aguardando ingestão de nutrientes para análise..."
                </div>
                <div class="grid grid-cols-2 gap-2 text-[10px] font-bold uppercase">
                    <button onclick="alquimia('proteina')" class="p-2 border border-emerald-900/50 bg-emerald-900/10 hover:bg-emerald-900/30 text-emerald-400">Sintetizar Proteína</button>
                    <button onclick="alquimia('carbo')" class="p-2 border border-emerald-900/50 bg-emerald-900/10 hover:bg-emerald-900/30 text-emerald-400">Carga Hidratada</button>
                </div>
            </section>
        </div>

        <div class="mt-12 text-center">
            <button onclick="iniciarBoss()" class="px-8 py-3 border-2 border-red-600 text-red-600 font-system text-lg hover:bg-red-600 hover:text-white transition-colors animate-pulse">
                INVOCAR BOSS DA SEMANA
            </button>
        </div>
    </div>

    <script>
        let xp = 20;
        let rank = 'F';

        function atualizarUI() {
            document.getElementById('xp-bar').style.width = xp + '%';
            document.getElementById('user-rank').innerText = 'Rank ' + rank;
            lucide.createIcons();
        }

        function ganharXP() {
            xp += 15;
            if (xp >= 100) {
                xp = 0;
                rank = rank === 'F' ? 'E' : 'D';
                triggerFlash();
            }
            atualizarUI();
        }

        function triggerFlash() {
            const f = document.createElement('div');
            f.className = 'fixed inset-0 z-[200] level-up-flash pointer-events-none';
            document.body.appendChild(f);
            setTimeout(() => f.remove(), 500);
        }

        function alquimia(tipo) {
            const falas = {
                'proteina': '[SISTEMA]: Reconstrução miofibrilar iniciada. Proteína detectada.',
                'carbo': '[SISTEMA]: Estoque de glicogênio restaurado. Energia pronta para o combate.'
            };
            document.getElementById('alchemy-ia').innerText = falas[tipo];
        }

        // BOSS LOGIC
        let timer;
        function iniciarBoss() {
            document.getElementById('boss-overlay').style.display = 'flex';
            let t = 300;
            timer = setInterval(() => {
                t--;
                let m = Math.floor(t/60);
                let s = t%60;
                document.getElementById('boss-timer').innerText = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
                if(t <= 0) { clearInterval(timer); alert('SISTEMA: VOCÊ FOI ELIMINADO.'); location.reload(); }
            }, 1000);
        }

        function vencerBoss() {
            clearInterval(timer);
            document.getElementById('boss-overlay').style.display = 'none';
            xp = 99;
            rank = 'S';
            atualizarUI();
            alert("VOCÊ ATINGIU O RANK S TEMPORARIAMENTE. RECOMPENSA LIBERADA.");
        }

        lucide.createIcons();
    </script>
</body>
                                                                                                                                                                             </html>
